// 草案（Draft）：依据技术方案 §3.5 起草，尚未评审定稿，字段编号变更需走协议评审。
//
// 来源：tech_v0.1.md §3.5 Gateway 协议定义，参考 §3.4 ProviderCapabilities、§4.5 通信协议。
// 约定：
//   1. proto3；包名 duckdb.hbase.v1；Java 包名 com.duckdb.hbase.protocol.v1。
//   2. RowKey 一律使用 bytes，按 HBase 字节序处理，禁止默认按 UTF-8 字符串处理。
//   3. 字段编号严格按方案 §3.5 的顺序从 1 递增；来源未定义的字段一律不补造，只标注待定。
//   4. 控制面使用 Protobuf，数据面使用 Arrow IPC（承载于 ArrowBatch.ipc_payload）。

syntax = "proto3";

package duckdb.hbase.v1;

option java_package = "com.duckdb.hbase.protocol.v1";
option java_multiple_files = true;

// HBase 数据访问服务：由 Extension 调用，Gateway 实现。
service HBaseDataService {
  // 能力协商：获取 Gateway 支持的 Scan / BatchGet / 时间戳等能力。
  rpc GetCapabilities(CapabilityRequest) returns (CapabilityResponse);

  // 获取表 Schema 与 Logical Type 描述。
  rpc GetSchema(SchemaRequest) returns (SchemaResponse);

  // 范围扫描：服务端流式返回 ArrowBatch，禁止一次性返回全量结果。
  rpc Scan(ScanRequest) returns (stream ArrowBatch);

  // 批量按 RowKey 读取：服务端流式返回 ArrowBatch。
  rpc BatchGet(BatchGetRequest) returns (stream ArrowBatch);

  // 取消指定请求：按 request_id 幂等。
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // 健康检查。
  rpc Health(HealthRequest) returns (HealthResponse);
}

// 列引用：列族 + 列限定符。
message ColumnRef {
  // 列族。
  string family = 1;
  // 列限定符。
  string qualifier = 2;
}

// 范围扫描请求。
message ScanRequest {
  // 请求唯一标识，用于取消与追踪。
  string request_id = 1;
  // HBase Namespace。
  string namespace = 2;
  // 表名。
  string table = 3;
  // 起始 RowKey，二进制，按字节序比较。
  bytes start_row = 4;
  // 结束 RowKey，二进制，按字节序比较。
  bytes stop_row = 5;
  // 是否包含起始 RowKey。
  bool include_start = 6;
  // 是否包含结束 RowKey。
  bool include_stop = 7;
  // 列裁剪列表；为空时的语义待定（TBD）。
  repeated ColumnRef columns = 8;
  // 最小时间戳；单位待定（TBD，方案未明确）。
  int64 min_timestamp = 9;
  // 最大时间戳；单位待定（TBD，方案未明确）。
  int64 max_timestamp = 10;
  // 最大版本数。
  int32 max_versions = 11;
  // 期望批大小；受能力协商的 max_batch_size 与服务端限制约束。
  int32 batch_size = 12;
}

// 按 RowKey 批量读取请求，用于部分缓存命中时补列。
message BatchGetRequest {
  // 请求唯一标识，用于取消与追踪。
  string request_id = 1;
  // HBase Namespace。
  string namespace = 2;
  // 表名。
  string table = 3;
  // 待读取 RowKey 列表，二进制。
  repeated bytes rowkeys = 4;
  // 列裁剪列表。
  repeated ColumnRef columns = 5;
  // 最小时间戳；单位待定（TBD，方案未明确）。
  int64 min_timestamp = 6;
  // 最大时间戳；单位待定（TBD，方案未明确）。
  int64 max_timestamp = 7;
}

// 错误码：Gateway 通过 trailing metadata "hbase-error-bin" 返回序列化的 ErrorInfo。
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // 请求参数非法（RowKey、列描述、版本参数等）
  ERROR_CODE_INVALID_REQUEST = 1;
  // 表 / 列族不存在
  ERROR_CODE_NOT_FOUND = 2;
  // 认证或授权失败
  ERROR_CODE_PERMISSION_DENIED = 3;
  // Gateway 或 HBase 暂不可用（可重试）
  ERROR_CODE_UNAVAILABLE = 4;
  // 限流 / 资源不足（可重试）
  ERROR_CODE_RESOURCE_EXHAUSTED = 5;
  // 查询被取消
  ERROR_CODE_CANCELLED = 6;
  // 能力不支持（如 BatchGet）
  ERROR_CODE_UNSUPPORTED = 7;
  // 未预期内部错误
  ERROR_CODE_INTERNAL = 8;
}

// 结构化错误详情。
message ErrorInfo {
  ErrorCode code = 1;
  string message = 2;
  // 是否建议重试；流式 Scan 已返回数据后不应整体重试。
  bool retryable = 3;
  string request_id = 4;
}

// 数据面批次编码。
enum BatchEncoding {
  BATCH_ENCODING_UNSPECIFIED = 0;
  // M1 简化列式编码：UTF8 列 + 长度表（见 docs/protocol.md §3.4），无第三方依赖。
  BATCH_ENCODING_UTF8_COLUMNS = 1;
  // 目标格式：Arrow IPC stream（M2 切换）。
  BATCH_ENCODING_ARROW_IPC = 2;
}

// 流式数据批次：控制面元数据 + 数据面载荷。
message ArrowBatch {
  // Arrow IPC 数据载荷，承载实际列数据。
  bytes ipc_payload = 1;
  // 批次序号，用于顺序校验与续传。
  uint64 sequence_number = 2;
  // 是否为本次请求的最后一批。
  bool finished = 3;
  // 本批行数。
  uint64 row_count = 4;
  // 载荷编码；M1 固定为 BATCH_ENCODING_UTF8_COLUMNS。
  BatchEncoding encoding = 5;
}

// 能力协商请求。
message CapabilityRequest {}

// 能力协商响应：逐项对应方案 §3.4 的 ProviderCapabilities。
message CapabilityResponse {
  bool supports_scan = 1;
  bool supports_batch_get = 2;
  bool supports_rowkey_range = 3;
  bool supports_column_projection = 4;
  bool supports_timestamp = 5;
  bool supports_versions = 6;
  bool supports_filter_pushdown = 7;
  bool supports_async_scan = 8;
  bool supports_cancellation = 9;
  int32 max_batch_size = 10;
  int32 max_parallel_scans = 11;
}

// Schema 查询请求。
message SchemaRequest {
  // HBase Namespace。
  string namespace = 1;
  // 表名。
  string table = 2;
}

// 单列 Schema。HBase 无固定 schema，qualifier 为空表示整列族。
message ColumnSchema {
  string family = 1;
  string qualifier = 2;
  // DuckDB LogicalType 名称（如 VARCHAR/BIGINT），映射规则见 docs/protocol.md。
  string sql_type = 3;
}

// Schema 查询响应。
message SchemaResponse {
  repeated ColumnSchema columns = 1;
}

// 取消请求：按 request_id 幂等。
message CancelRequest {
  string request_id = 1;
}

// 取消响应。
message CancelResponse {
  bool cancelled = 1;
}

// 健康检查请求。
message HealthRequest {}

// 健康检查响应。
message HealthResponse {
  // serving / not_serving / unknown
  string status = 1;
  // Gateway 版本。
  string version = 2;
}
