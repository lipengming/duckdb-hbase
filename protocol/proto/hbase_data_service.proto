// 草案（Draft）：依据技术方案 §3.5 起草，尚未评审定稿，字段编号变更需走协议评审。
//
// 来源：tech_v0.1.md §3.5 Gateway 协议定义，参考 §3.4 ProviderCapabilities、§4.5 通信协议。
// 约定：
//   1. proto3；包名 duckdb.hbase.v1；Java 包名 com.duckdb.hbase.protocol.v1。
//   2. RowKey 一律使用 bytes，按 HBase 字节序处理，禁止默认按 UTF-8 字符串处理。
//   3. 字段编号严格按方案 §3.5 的顺序从 1 递增；来源未定义的字段一律不补造，只标注待定。
//   4. 控制面使用 Protobuf，数据面使用 Arrow IPC（承载于 ArrowBatch.ipc_payload）。

syntax = "proto3";

package duckdb.hbase.v1;

option java_package = "com.duckdb.hbase.protocol.v1";

// HBase 数据访问服务：由 Extension 调用，Gateway 实现。
service HBaseDataService {
  // 能力协商：获取 Gateway 支持的 Scan / BatchGet / 时间戳等能力。
  rpc GetCapabilities(CapabilityRequest) returns (CapabilityResponse);

  // 获取表 Schema 与 Logical Type 描述。
  rpc GetSchema(SchemaRequest) returns (SchemaResponse);

  // 范围扫描：服务端流式返回 ArrowBatch，禁止一次性返回全量结果。
  rpc Scan(ScanRequest) returns (stream ArrowBatch);

  // 批量按 RowKey 读取：服务端流式返回 ArrowBatch。
  rpc BatchGet(BatchGetRequest) returns (stream ArrowBatch);

  // 取消指定请求：按 request_id 幂等。
  rpc Cancel(CancelRequest) returns (CancelResponse);

  // 健康检查。
  rpc Health(HealthRequest) returns (HealthResponse);
}

// 列引用：列族 + 列限定符。
message ColumnRef {
  // 列族。
  string family = 1;
  // 列限定符。
  string qualifier = 2;
}

// 范围扫描请求。
message ScanRequest {
  // 请求唯一标识，用于取消与追踪。
  string request_id = 1;
  // HBase Namespace。
  string namespace = 2;
  // 表名。
  string table = 3;
  // 起始 RowKey，二进制，按字节序比较。
  bytes start_row = 4;
  // 结束 RowKey，二进制，按字节序比较。
  bytes stop_row = 5;
  // 是否包含起始 RowKey。
  bool include_start = 6;
  // 是否包含结束 RowKey。
  bool include_stop = 7;
  // 列裁剪列表；为空时的语义待定（TBD）。
  repeated ColumnRef columns = 8;
  // 最小时间戳；单位待定（TBD，方案未明确）。
  int64 min_timestamp = 9;
  // 最大时间戳；单位待定（TBD，方案未明确）。
  int64 max_timestamp = 10;
  // 最大版本数。
  int32 max_versions = 11;
  // 期望批大小；受能力协商的 max_batch_size 与服务端限制约束。
  int32 batch_size = 12;
}

// 按 RowKey 批量读取请求，用于部分缓存命中时补列。
message BatchGetRequest {
  // 请求唯一标识，用于取消与追踪。
  string request_id = 1;
  // HBase Namespace。
  string namespace = 2;
  // 表名。
  string table = 3;
  // 待读取 RowKey 列表，二进制。
  repeated bytes rowkeys = 4;
  // 列裁剪列表。
  repeated ColumnRef columns = 5;
  // 最小时间戳；单位待定（TBD，方案未明确）。
  int64 min_timestamp = 6;
  // 最大时间戳；单位待定（TBD，方案未明确）。
  int64 max_timestamp = 7;
}

// 流式数据批次：控制面元数据 + Arrow IPC 数据面。
message ArrowBatch {
  // Arrow IPC 数据载荷，承载实际列数据。
  bytes ipc_payload = 1;
  // 批次序号，用于顺序校验与续传。
  uint64 sequence_number = 2;
  // 是否为本次请求的最后一批。
  bool finished = 3;
  // 本批行数。
  uint64 row_count = 4;
}

// 能力协商请求。
// 待定（TBD）：方案 §3.5 未定义字段，评审后补充，禁止擅自编号。
message CapabilityRequest {}

// 能力协商响应。
// 待定（TBD）：方案 §3.5 未定义字段；语义应覆盖 §3.4 的 ProviderCapabilities
// （supports_scan、supports_batch_get、supports_rowkey_range、max_batch_size 等 11 项），
// 字段名与编号须经协议评审后补充。
message CapabilityResponse {}

// Schema 查询请求。
// 待定（TBD）：至少需要 namespace / table 定位，方案 §3.5 未给出字段定义，暂不编号。
message SchemaRequest {}

// Schema 查询响应。
// 待定（TBD）：应包含 Schema 与 Logical Type 描述，方案 §3.5 未给出字段定义。
message SchemaResponse {}

// 取消请求。
// 待定（TBD）：语义上需携带 request_id，方案 §3.5 未定义字段，暂不编号。
message CancelRequest {}

// 取消响应。
// 待定（TBD）：需表达幂等取消结果，方案 §3.5 未定义字段。
message CancelResponse {}

// 健康检查请求。
// 待定（TBD）：方案 §3.5 未定义字段。
message HealthRequest {}

// 健康检查响应。
// 待定（TBD）：方案 §3.5 未定义字段。
message HealthResponse {}
