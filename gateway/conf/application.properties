# DuckDB-HBase Gateway 配置（M1 使用 .properties；YAML 待 M2）
# 启动：java -jar gateway-server.jar conf/application.properties

# 选用哪个 Adapter：native-java（默认）/ rest / thrift / phoenix（后三者 M5）
gateway.adapter=native-java

# gRPC 监听地址与端口
gateway.server.host=127.0.0.1
gateway.server.port=18080

# 以下 hbase.* 会去掉前缀后透传给 Adapter
# 单机 HBase（standalone）通常是 localhost:2181；集群按实际 ZooKeeper 地址填写
hbase.zookeeper.quorum=127.0.0.1
hbase.zookeeper.property.clientPort=2181
hbase.zookeeper.znode.parent=/hbase
